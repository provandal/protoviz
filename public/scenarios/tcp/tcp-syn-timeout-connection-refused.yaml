meta:
  id: "tcp-syn-timeout-connection-refused"
  title: "TCP Error: SYN Timeout vs Connection Refused"
  protocol: "TCP"
  protocol_family: "TCP/IP"
  version: "1.0.0"
  description: >
    Error scenario: two ways a TCP connection attempt can fail before it ever
    begins. Attempt #1 targets a closed port — the server's kernel answers the
    SYN with an immediate RST and connect() fails fast with ECONNREFUSED.
    Attempt #2 targets a port behind a firewall that silently discards the SYN —
    the client retransmits with exponential backoff (1 s, 2 s, 4 s...) and only
    gives up after ~127 seconds with ETIMEDOUT. Understanding the difference
    between "refused" and "timed out" is the first branch in almost every
    connectivity troubleshooting flowchart. Builds on the foundation scenario
    "TCP: 3-Way Handshake → Data Transfer → FIN Teardown".

  learning_objectives:
    - "Distinguish the two classic connect() failures: ECONNREFUSED (fast, active refusal) vs ETIMEDOUT (slow, silence)"
    - "See how a host with no listener on a port responds to a SYN with RST+ACK (RFC 9293 reset generation)"
    - "Trace SYN retransmission with exponential backoff: 1 s, 2 s, 4 s, 8 s... governed by tcp_syn_retries"
    - "Understand why firewalls that DROP (silently discard) produce slow failures while REJECT produces fast ones"
    - "Read the RST segment's sequence/acknowledgment numbers and see why SEQ=0, ACK=ISN+1"
    - "Learn what SYN_SENT state means and how long a client will wait in it"
    - "Build the troubleshooting instinct: instant failure → something answered; hanging failure → something is eating your packets"

  difficulty: "beginner"

  authors:
    - name: "ProtoViz Community"
      org: "proto-viz"
      github: "proto-viz"

  created: "2026-08-12"
  updated: "2026-08-12"

  tags:
    - "TCP"
    - "TCP/IP"
    - "error"
    - "troubleshooting"
    - "SYN"
    - "RST"
    - "ECONNREFUSED"
    - "ETIMEDOUT"
    - "exponential backoff"
    - "firewall"
    - "beginner"
    - "education"

  primary_specs:
    - document: "RFC 9293"
      section: "3.5.2"
      title: "Reset Generation"
      url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.2"
      alt_url: "https://www.rfc-editor.org/rfc/rfc9293"
    - document: "RFC 9293"
      section: "3.3.2"
      title: "TCP State Machine — SYN_SENT"
      url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.3.2"
      alt_url: ""
    - document: "RFC 6298"
      section: "5"
      title: "Managing the RTO Timer"
      url: "https://datatracker.ietf.org/doc/html/rfc6298#section-5"
      alt_url: ""

  content_disclaimer: >
    Protocol descriptions in this scenario are based on open-source implementations
    (Linux kernel, Wireshark dissectors) and public RFCs. No proprietary specification
    text has been reproduced. RFC references are provided as citations for further reading.

  source_references:
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_ipv4.c"
      description: "tcp_v4_send_reset — RST generation for segments arriving at closed ports"
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_timer.c"
      description: "tcp_retransmit_timer / tcp_write_timeout — SYN retransmission and backoff"
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_output.c"
      description: "tcp_connect — SYN construction and initial timer arming"

# ─────────────────────────────────────────────────────────────────
# TOPOLOGY
# ─────────────────────────────────────────────────────────────────
topology:
  actors:
    - id: "client"
      type: "host"
      label: "Client"
      description: "TCP client — calls connect() twice, with very different results"
      hardware: "Generic 10GbE NIC"
      os: "Linux 6.x"
      kernel_version: "6.8"
      ip: "10.0.1.10"
      mac: "00:11:22:33:44:01"
      position: "left"

    - id: "firewall"
      type: "switch"
      label: "Firewall"
      description: "L2/L3 forwarding device with a filtering policy: forwards traffic to port 9090, silently drops traffic to port 8443"
      hardware: "Generic filtering router"
      position: "center"

    - id: "server"
      type: "host"
      label: "Server"
      description: "Server host — reachable, but nothing is listening on the target ports"
      hardware: "Generic 10GbE NIC"
      os: "Linux 6.x"
      kernel_version: "6.8"
      ip: "10.0.1.20"
      mac: "00:11:22:33:44:02"
      position: "right"

  links:
    - id: "link-c-fw"
      from: "client"
      to: "firewall"
      speed_gbps: 10
      media: "copper_dac"
      fec: "FC-FEC"
      autoneg: true
    - id: "link-fw-s"
      from: "firewall"
      to: "server"
      speed_gbps: 10
      media: "copper_dac"
      fec: "FC-FEC"
      autoneg: true

# ─────────────────────────────────────────────────────────────────
# OSI LAYER DEFINITIONS (per actor)
# ─────────────────────────────────────────────────────────────────
osi_layers:
  client:
    - layer: 7
      name: "Application"
      components: ["user application", "libc socket API"]
      state_schema:
        app_state:
          type: "string"
          description: "Application-level state"
          initial: "idle"
        socket_fd:
          type: "string"
          description: "Socket file descriptor"
          initial: "none"
        errno:
          type: "string"
          description: "Last error returned by a socket call"
          initial: "—"

    - layer: 5
      name: "Session / Socket"
      components: ["net/socket.c", "net/ipv4/af_inet.c"]
      state_schema:
        socket_state:
          type: "string"
          description: "Kernel socket state"
          initial: "SS_UNCONNECTED"
        local_port:
          type: "integer"
          description: "Local (ephemeral) port number"
          initial: 0
        remote_port:
          type: "integer"
          description: "Remote port number"
          initial: 0

    - layer: 4
      name: "TCP"
      components: ["net/ipv4/tcp.c", "net/ipv4/tcp_output.c", "net/ipv4/tcp_timer.c"]
      state_schema:
        tcp_state:
          type: "string"
          description: "TCP state machine state (RFC 9293 §3.3.2)"
          initial: "CLOSED"
        seq_num:
          type: "string"
          description: "Next sequence number to send (SND.NXT)"
          initial: "—"
        syn_retries:
          type: "integer"
          description: "SYN retransmissions so far (limit: tcp_syn_retries = 6)"
          initial: 0
        retrans_timer:
          type: "string"
          description: "Current retransmission timeout for the SYN"
          initial: "—"

    - layer: 3
      name: "IP / Routing"
      components: ["net/ipv4/ip_output.c", "net/ipv4/route.c"]
      state_schema:
        src_ip:
          type: "string"
          description: "Source IP address"
          initial: "10.0.1.10"
        dst_ip:
          type: "string"
          description: "Destination IP address"
          initial: "10.0.1.20"
        ttl:
          type: "integer"
          initial: 64

    - layer: 2
      name: "Ethernet"
      components: ["NIC driver", "IEEE 802.3"]
      state_schema:
        link_state:
          type: "string"
          initial: "up"
        mac_addr:
          type: "string"
          initial: "00:11:22:33:44:01"
        arp_resolved:
          type: "boolean"
          description: "Destination MAC known via ARP"
          initial: true

    - layer: 1
      name: "Physical (10GbE)"
      components: ["IEEE 802.3", "10GBASE-CR"]
      state_schema:
        phy_state:
          type: "string"
          description: "Physical layer state"
          initial: "up"
        speed:
          type: "string"
          initial: "10 Gbps"

  server:
    - layer: 7
      name: "Application"
      components: ["(no process bound to 9090 or 8443)"]
      state_schema:
        app_state:
          type: "string"
          description: "Application-level state"
          initial: "nothing bound to 9090/8443"
        listeners:
          type: "string"
          description: "Ports with active listeners"
          initial: "22 only"

    - layer: 4
      name: "TCP"
      components: ["net/ipv4/tcp_ipv4.c"]
      state_schema:
        tcp_state:
          type: "string"
          description: "TCP state machine state for the probed ports"
          initial: "CLOSED"
        rst_sent:
          type: "integer"
          description: "RST segments generated for closed-port SYNs"
          initial: 0

    - layer: 3
      name: "IP / Routing"
      components: ["net/ipv4/ip_output.c"]
      state_schema:
        src_ip:
          type: "string"
          description: "Source IP address"
          initial: "10.0.1.20"
        dst_ip:
          type: "string"
          description: "Destination IP address"
          initial: "null"
        ttl:
          type: "integer"
          initial: 64

    - layer: 2
      name: "Ethernet"
      components: ["NIC driver", "IEEE 802.3"]
      state_schema:
        link_state:
          type: "string"
          initial: "up"
        mac_addr:
          type: "string"
          initial: "00:11:22:33:44:02"
        arp_resolved:
          type: "boolean"
          initial: true

    - layer: 1
      name: "Physical (10GbE)"
      components: ["IEEE 802.3", "10GBASE-CR"]
      state_schema:
        phy_state:
          type: "string"
          initial: "up"
        speed:
          type: "string"
          initial: "10 Gbps"

# ─────────────────────────────────────────────────────────────────
# FRAMES
# ─────────────────────────────────────────────────────────────────
frames:
  # ── Attempt #1: closed port → RST ───────────────────────────────
  - id: "tcp_refused_syn"
    name: "TCP SYN (port 9090)"
    description: "Client attempts to connect to port 9090 — a closed port with no listener"
    from: "client"
    to: "server"
    via: ["firewall"]
    timestamp_ns: 1000000000
    total_bytes: 74
    color: "#0f766e"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Server's MAC (already in the neighbor cache)"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            value_hex: "0x0800"
            description: "IPv4"

      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Total Length"
            abbrev: "ip.len"
            bits: 16
            value: 60
            description: "IP header (20) + TCP header with options (40)"
          - name: "Identification"
            abbrev: "ip.id"
            bits: 16
            value: "0xa1c0"
            description: "Unique per datagram"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP (protocol number 6)"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.10"
            description: "Client's IP address"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.20"
            description: "Server's IP address"

      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 40
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 49200
            description: "Ephemeral port chosen by the kernel"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
            value: 9090
            description: "Target port — the application the client expects here was never started"
          - name: "Sequence Number"
            abbrev: "tcp.seq"
            bits: 32
            value: 3100000
            value_hex: "0x002f4d60"
            description: "Client's Initial Sequence Number (ISN), chosen pseudo-randomly via SipHash"
            spec_refs:
              - document: "RFC 9293"
                section: "3.4.1"
                title: "Initial Sequence Number Selection"
                url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.4.1"
          - name: "Acknowledgment Number"
            abbrev: "tcp.ack"
            bits: 32
            value: 0
            description: "Zero — ACK flag not set in a SYN-only segment"
          - name: "Flags"
            abbrev: "tcp.flags"
            bits: 8
            value: "0x02"
            description: "SYN=1 — connection request"
            spec_refs:
              - document: "RFC 9293"
                section: "3.6"
                title: "Header Format — Control Bits"
                url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.6"
            fields:
              - name: "SYN"
                abbrev: "tcp.flags.syn"
                bits: 1
                value: 1
                description: "Synchronize sequence numbers — connection request"
              - name: "ACK"
                abbrev: "tcp.flags.ack"
                bits: 1
                value: 0
                description: "No acknowledgment yet"
              - name: "RST"
                abbrev: "tcp.flags.reset"
                bits: 1
                value: 0
                description: "Not a reset"
          - name: "Window Size"
            abbrev: "tcp.window_size"
            bits: 16
            value: 65535
            description: "Client's advertised receive window"
          - name: "Checksum"
            abbrev: "tcp.checksum"
            bits: 16
            value: "0x8c11"
            description: "TCP checksum over pseudo-header + TCP header"
          - name: "Options"
            abbrev: "tcp.options"
            bits: 160
            value: "MSS=1460, SACK-Permitted, Window Scale=7, Timestamps"
            description: "Standard handshake options (20 bytes) — negotiation that will never complete"

  - id: "tcp_refused_rst"
    name: "TCP RST+ACK"
    description: "Server's kernel answers the SYN to a closed port with an immediate reset — this is ECONNREFUSED on the wire"
    from: "server"
    to: "client"
    via: ["firewall"]
    timestamp_ns: 1000100000
    total_bytes: 60
    color: "#dc2626"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Server's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            description: "IPv4"

      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Total Length"
            abbrev: "ip.len"
            bits: 16
            value: 40
            description: "IP header (20) + bare TCP header (20) — resets carry no options and no data"
          - name: "Identification"
            abbrev: "ip.id"
            bits: 16
            value: "0x0000"
            description: "Kernel-generated RSTs commonly use IP ID 0"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.20"
            description: "Server's IP — the reset really comes from the target host"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.10"
            description: "Client's IP"

      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 20
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 9090
            description: "The closed port the client probed"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
            value: 49200
            description: "Client's ephemeral port"
          - name: "Sequence Number"
            abbrev: "tcp.seq"
            bits: 32
            value: 0
            value_hex: "0x00000000"
            description: "Zero — the incoming SYN carried no ACK, so the reset's sequence number is 0 per RFC 9293 reset-generation rules"
            spec_refs:
              - document: "RFC 9293"
                section: "3.5.2"
                title: "Reset Generation"
                url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.2"
            kernel_ref:
              file: "net/ipv4/tcp_ipv4.c"
              function: "tcp_v4_send_reset"
              notes: "Builds the RST for segments that match no socket"
          - name: "Acknowledgment Number"
            abbrev: "tcp.ack"
            bits: 32
            value: 3100001
            value_hex: "0x002f4d61"
            description: "Client's ISN + 1 (the SYN consumes one sequence number) — this is what lets the client match the RST to its pending connection attempt"
            spec_refs:
              - document: "RFC 9293"
                section: "3.5.2"
                title: "Reset Generation"
                url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.2"
          - name: "Flags"
            abbrev: "tcp.flags"
            bits: 8
            value: "0x14"
            description: "RST=1, ACK=1 — active refusal of the connection attempt"
            fields:
              - name: "RST"
                abbrev: "tcp.flags.reset"
                bits: 1
                value: 1
                description: "Reset — there is no socket to deliver this SYN to"
              - name: "ACK"
                abbrev: "tcp.flags.ack"
                bits: 1
                value: 1
                description: "Acknowledgment field is valid (it references the SYN's sequence number)"
              - name: "SYN"
                abbrev: "tcp.flags.syn"
                bits: 1
                value: 0
                description: "Not a connection request"
          - name: "Window Size"
            abbrev: "tcp.window_size"
            bits: 16
            value: 0
            description: "Zero — meaningless in a reset; there will never be data"
          - name: "Checksum"
            abbrev: "tcp.checksum"
            bits: 16
            value: "0x51b0"
            description: "TCP checksum"

  # ── Attempt #2: filtered port → silence ─────────────────────────
  - id: "tcp_timeout_syn"
    name: "TCP SYN (port 8443)"
    description: "Client attempts to connect to port 8443 — the firewall's policy silently discards this segment; it never reaches the server"
    from: "client"
    to: "firewall"
    via: []
    timestamp_ns: 6000000000
    total_bytes: 74
    color: "#0f766e"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Server's MAC — the client addresses the server; it has no idea a policy will eat the frame"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            description: "IPv4"

      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Total Length"
            abbrev: "ip.len"
            bits: 16
            value: 60
            description: "IP header (20) + TCP header with options (40)"
          - name: "Identification"
            abbrev: "ip.id"
            bits: 16
            value: "0xb200"
            description: "Unique per datagram"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.10"
            description: "Client's IP address"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.20"
            description: "Server's IP address"

      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 40
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 49201
            description: "New ephemeral port for the second attempt"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
            value: 8443
            description: "Target port — blocked by firewall policy (DROP, not REJECT)"
          - name: "Sequence Number"
            abbrev: "tcp.seq"
            bits: 32
            value: 3200000
            value_hex: "0x0030d400"
            description: "New ISN for this connection attempt"
          - name: "Acknowledgment Number"
            abbrev: "tcp.ack"
            bits: 32
            value: 0
            description: "Zero — ACK flag not set"
          - name: "Flags"
            abbrev: "tcp.flags"
            bits: 8
            value: "0x02"
            description: "SYN=1 — connection request"
            fields:
              - name: "SYN"
                abbrev: "tcp.flags.syn"
                bits: 1
                value: 1
                description: "Synchronize sequence numbers"
          - name: "Window Size"
            abbrev: "tcp.window_size"
            bits: 16
            value: 65535
            description: "Client's advertised receive window"
          - name: "Checksum"
            abbrev: "tcp.checksum"
            bits: 16
            value: "0x77a2"
            description: "TCP checksum"
          - name: "Options"
            abbrev: "tcp.options"
            bits: 160
            value: "MSS=1460, SACK-Permitted, Window Scale=7, Timestamps (TSval=100000)"
            description: "Standard handshake options"

  - id: "tcp_syn_retx_1"
    name: "TCP SYN retransmit #1"
    description: "1 second with no reply — the retransmission timer fires and the kernel resends the identical SYN"
    from: "client"
    to: "firewall"
    via: []
    timestamp_ns: 7000000000
    total_bytes: 74
    color: "#d97706"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Server's MAC"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            description: "IPv4"

      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Identification"
            abbrev: "ip.id"
            bits: 16
            value: "0xb201"
            description: "New IP ID — this is a new datagram even though the TCP content is identical"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.10"
            description: "Client's IP address"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.20"
            description: "Server's IP address"

      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 40
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 49201
            description: "Same ephemeral port — same connection attempt"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
