# ─────────────────────────────────────────────────────────────────
# TIMELINE
# ─────────────────────────────────────────────────────────────────
timeline:
  # ── Phase: healthy data flow ─────────────────────────────────────
  - id: "evt_tcp_data_setup"
    type: "state_change"
    t_ns: 0
    annotation:
      text: "Mid-transfer: the TCP connection is ESTABLISHED and the client is sending a 1 MB upload"
      detail: >
        We join a connection that is already up (see the foundation scenario
        for the handshake) and busy: the client is uploading a 1 MB file in
        1460-byte segments. Round-trip time on this LAN is ~120 µs, the
        congestion window is 10 segments, and the retransmission timeout is
        sitting at its practical floor — Linux clamps the RTO to a minimum of
        ~200 ms no matter how fast the network is. Keep that asymmetry in
        mind: the timer that protects this transfer is ~1,700× slower than
        the network it protects.
      spec_refs:
        - document: "RFC 6298"
          section: "2"
          title: "Computing TCP's Retransmission Timer"
          url: "https://datatracker.ietf.org/doc/html/rfc6298#section-2"

  - id: "evt_tcp_data_seg1"
    type: "frame_tx"
    t_ns: 100000000
    frame_id: "tcp_data_seg1"
    annotation:
      text: "TCP data segment → bytes 5000001–5001460: the healthy baseline"
      detail: >
        A full-MSS segment leaves the client. Nothing special — this is what
        millions of segments before it looked like. The timestamp option
        (TSval) stamps its departure; the echo in the ACK will give the sender
        a fresh RTT sample, which feeds the smoothed RTT and RTO calculation.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_nxt: "5001461"
              snd_una: "5000001"

  - id: "evt_tcp_data_ack1"
    type: "frame_tx"
    t_ns: 100120000
    frame_id: "tcp_data_ack1"
    annotation:
      text: "TCP ACK ← 5001461 after 120 µs — this is what health looks like"
      detail: >
        The receiver delivers the bytes to the application and acknowledges.
        SND.UNA advances; the retransmit buffer releases the segment; the RTT
        sample (120 µs) keeps SRTT tight. Every mechanism in this scenario is
        already armed and running during healthy transfer — timers, buffers,
        counters — you only notice them when something breaks.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_una: "5001461"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              rcv_nxt: "5001461"
          - layer: 7
            name: "Application"
            state_fields:
              bytes_received: 1460

  # ── Phase: loss with nothing behind it → RTO ─────────────────────
  - id: "evt_tcp_data_seg2"
    type: "frame_tx"
    t_ns: 100200000
    frame_id: "tcp_data_seg2"
    annotation:
      text: "TCP data segment seq 5001461 — this one dies in the switch's overflowing egress queue"
      detail: >
        The application pauses after queueing these 1460 bytes (waiting on its
        own disk I/O), so this segment travels alone — nothing follows it.
        At the switch, a traffic burst from another port has filled the egress
        queue: tail-drop. The segment is discarded silently. Ethernet has no
        retransmission and no notification — loss recovery is entirely TCP's
        job, end to end.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_nxt: "5002921"

  - id: "evt_tcp_data_seg2_dropped"
    type: "error"
    t_ns: 100210000
    annotation:
      text: "Segment dropped — tail-drop in the congested egress queue"
      detail: >
        The switch's shallow buffer overflowed for a few microseconds — long
        enough to kill this segment. Neither endpoint knows yet. The client's
        retransmission timer (armed at 204 ms when the segment was sent) is
        now the only mechanism that can detect this loss, because with no
        segments in flight behind the lost one, the receiver has no way to
        notice anything is missing: from its perspective, the sender simply
        went quiet.

  - id: "evt_tcp_rto_wait"
    type: "state_change"
    t_ns: 150000000
    annotation:
      text: "Dead air — no duplicate ACKs are possible, so only the RTO timer can save this transfer"
      detail: >
        This is the worst case for TCP loss recovery: the lost segment was the
        last one in flight. Duplicate ACKs — the fast detection mechanism —
        require later segments to arrive and jog the receiver into repeating
        its ACK. With nothing behind the loss, there is nothing to trigger
        them. The connection sits idle while both sides wait: the receiver for
        byte 5001461, the sender for an ACK that will never come. Only the
        conservative 204 ms timer ticks toward recovery.

  - id: "evt_tcp_rto_expired"
    type: "error"
    t_ns: 304400000
    annotation:
      text: "RTO expires after 204 ms — an eternity on a 120 µs network"
      detail: >
        The retransmission timer fires: 204 ms of silence for a network that
        answers in 120 µs — about 1,700 round trips of dead time. Why so
        conservative? The RTO is computed as SRTT + 4×RTTVAR (RFC 6298) with a
        floor (200 ms on Linux, tunable per route with rto_min). A spurious
        timeout would retransmit needlessly and collapse the congestion window
        for nothing, so the timer errs far on the side of patience. TCP treats
        an RTO as evidence of serious trouble — and reacts drastically.
      spec_refs:
        - document: "RFC 6298"
          section: "5"
          title: "Managing the RTO Timer"
          url: "https://datatracker.ietf.org/doc/html/rfc6298#section-5"

  - id: "evt_tcp_rto_retx"
    type: "frame_tx"
    t_ns: 304400000
    frame_id: "tcp_rto_retx_seg2"
    annotation:
      text: "RTO retransmission → seq 5001461 again; cwnd collapses 10 → 1, ssthresh set to 2"
      detail: >
        The kernel resends the oldest unacknowledged segment and takes the
        RTO penalty prescribed by RFC 5681: ssthresh drops to half the data
        in flight (with a floor of 2 segments — here the flight was a single
        segment, so the floor applies), and cwnd collapses all the way to
        1 segment. The transfer restarts from slow start as if the connection
        were newborn. The RTO timer itself doubles (204 → 408 ms) in case
        this retransmission also vanishes — the same exponential backoff the
        SYN-timeout scenario shows.
      spec_refs:
        - document: "RFC 5681"
          section: "3.1"
          title: "Slow Start and Congestion Avoidance"
          url: "https://datatracker.ietf.org/doc/html/rfc5681#section-3.1"
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              cwnd: "1"
              ssthresh: "2"
              rto_ms: "408"

  - id: "evt_tcp_rto_ack"
    type: "frame_tx"
    t_ns: 304520000
    frame_id: "tcp_rto_ack"
    annotation:
      text: "TCP ACK ← 5002921: recovered — but the pipeline must rebuild from cwnd = 1"
      detail: >
        The retransmission arrives, the receiver delivers the bytes, and the
        ACK confirms recovery. Total damage: 204 ms of stalled transfer plus a
        congestion window at 1 segment. From here cwnd grows by slow start to
        ssthresh (1 → 2), then congestion avoidance adds roughly one segment
        per RTT. On this 120 µs LAN that rebuild takes only a millisecond or
        two; on an 80 ms Internet path the same rebuild would take over half a
        second. Loss + RTO is how throughput dies on long-distance links.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_una: "5002921"
              rto_ms: "204"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              rcv_nxt: "5002921"
          - layer: 7
            name: "Application"
            state_fields:
              bytes_received: 2920

  # ── Phase: loss inside a burst → fast retransmit ─────────────────
  - id: "evt_tcp_data_burst"
    type: "state_change"
    t_ns: 399000000
    annotation:
      text: "~100 ms later: cwnd has climbed back to 10 and the application queues a 4-segment burst"
      detail: >
        The application's disk stall is over and data is flowing again. In the
        ~100 ms since the RTO (hundreds of RTTs on this LAN), the congestion
        window rebuilt: slow start doubled it to ssthresh (2), then congestion
        avoidance added ~1 segment per RTT back to 10. Now the application
        hands the socket 5840 bytes at once — four full segments that will be
        sent back-to-back. This burst is about to meet the same congested
        queue, with a very different outcome.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              cwnd: "10"
              ssthresh: "2"

  - id: "evt_tcp_data_seg3"
    type: "frame_tx"
    t_ns: 400000000
    frame_id: "tcp_data_seg3"
    annotation:
      text: "TCP data seq 5002921 — lost again, but this time three segments follow right behind"
      detail: >
        First segment of the burst — and the unlucky one: the switch queue
        blips again and it is tail-dropped. The crucial difference from the
        first loss: segments 4, 5, and 6 are microseconds behind it, and they
        will survive. Watch what the receiver does with them.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_nxt: "5004381"

  - id: "evt_tcp_data_seg3_dropped"
    type: "error"
    t_ns: 400010000
    annotation:
      text: "Segment dropped — same congested queue; the rest of the burst squeaks through"
      detail: >
        One more tail-drop, then the queue drains just enough. Random loss
        inside a burst is the common case on real networks — and it is
        exactly the case TCP's fast retransmit was designed for.

  - id: "evt_tcp_data_seg4"
    type: "frame_tx"
    t_ns: 400050000
    frame_id: "tcp_data_seg4"
    annotation:
      text: "TCP data seq 5004381 arrives out of order — the receiver spots the hole instantly"
      detail: >
        The receiver expected byte 5002921 but got 5004381 — a 1460-byte hole.
        It buffers these bytes in the out-of-order queue (they will not be
        delivered to the application yet) and immediately re-sends its ACK for
        5002921, now with a SACK block advertising exactly what it holds. That
        duplicate ACK is loss signal number one.
    state_after:
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              ooo_queue: "5004381–5005840"

  - id: "evt_tcp_data_seg5"
    type: "frame_tx"
    t_ns: 400060000
    frame_id: "tcp_data_seg5"
    annotation:
      text: "TCP data seq 5005841 — the out-of-order island grows"
      detail: >
        Segment 5 joins the buffer next to segment 4. The hole at 5002921 is
        unchanged, so the receiver will fire another duplicate ACK with a
        wider SACK block.
    state_after:
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              ooo_queue: "5004381–5007300"

  - id: "evt_tcp_data_seg6"
    type: "frame_tx"
    t_ns: 400070000
    frame_id: "tcp_data_seg6"
    annotation:
      text: "TCP data seq 5007301 (PSH) — end of the burst; three segments now wait behind the hole"
      detail: >
        The last segment of the burst lands. The receiver now holds 4380 bytes
        it cannot deliver to the application — in-order delivery is TCP's
        contract, and byte 5002921 is still missing. Everything now depends on
        the sender learning about the hole quickly.
    state_after:
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              ooo_queue: "5004381–5008760"

  - id: "evt_tcp_dupack_1"
    type: "frame_tx"
    t_ns: 400110000
    frame_id: "tcp_dupack_1"
    annotation:
      text: "Duplicate ACK #1 ← ack frozen at 5002921; SACK says 'I hold 5004381–5005840'"
      detail: >
        Cumulative acknowledgment cannot advance past a hole — so the ACK
        number repeats. That repetition is information: it tells the sender
        "later data arrived, but not the byte I asked for." The SACK option
        sharpens it into a map: the left edge (5004381) minus the ACK number
        (5002921) is exactly one missing segment. One duplicate could still be
        network reordering, so the sender only counts it and waits.
      spec_refs:
        - document: "RFC 2018"
          section: "3"
          title: "SACK Option Format"
          url: "https://datatracker.ietf.org/doc/html/rfc2018"
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              dup_acks_rcvd: 1
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              dup_acks_sent: 1

  - id: "evt_tcp_dupack_2"
    type: "frame_tx"
    t_ns: 400120000
    frame_id: "tcp_dupack_2"
    annotation:
      text: "Duplicate ACK #2 ← the SACK block widens to 5004381–5007300"
      detail: >
        Second repetition. Reordering is now less likely — real reordering
        usually resolves within a packet or two. The sender's dupACK counter
        sits at 2, one short of the threshold.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              dup_acks_rcvd: 2
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              dup_acks_sent: 2

  - id: "evt_tcp_dupack_3"
    type: "frame_tx"
    t_ns: 400130000
    frame_id: "tcp_dupack_3"
    annotation:
      text: "Duplicate ACK #3 ← threshold reached: fast retransmit fires, no timer needed"
      detail: >
        Three duplicate ACKs is RFC 5681's line between "probably reordered"
        and "almost certainly lost." The sender stops waiting: it will resend
        the missing segment immediately, 204 ms of RTO patience be damned.
        It also takes the milder congestion penalty of fast recovery —
        ssthresh = half the data in flight (floor 2 segments; four segments
        were in flight, so 2), and cwnd deflates toward ssthresh instead of
        collapsing to 1. The intuition: duplicate ACKs prove the network is
        still delivering packets, so the trouble is a single loss, not a
        blackout.
      spec_refs:
        - document: "RFC 5681"
          section: "3.2"
          title: "Fast Retransmit / Fast Recovery"
          url: "https://datatracker.ietf.org/doc/html/rfc5681#section-3.2"
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              dup_acks_rcvd: 3
              ssthresh: "2"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              dup_acks_sent: 3

  - id: "evt_tcp_fast_retx"
    type: "frame_tx"
    t_ns: 400135000
    frame_id: "tcp_fast_retx_seg3"
    annotation:
      text: "Fast retransmit → seq 5002921 resent ~135 µs after the original — ~1,500× sooner than the RTO path"
      detail: >
        Compare the two recoveries directly: the RTO path waited 204 ms
        (204,000 µs) to resend; the fast-retransmit path waited ~135 µs.
        Same network, same kind of loss — the only difference is that this
        loss had witnesses. The segments behind it turned the receiver into
        an active reporter instead of a silent waiter. This is why modern
        TCP performs so much better under load than early-1980s TCP: recovery
        became ACK-driven instead of timer-driven.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              cwnd: "5"

  - id: "evt_tcp_fast_retx_ack"
    type: "frame_tx"
    t_ns: 400255000
    frame_id: "tcp_fast_retx_ack"
    annotation:
      text: "TCP ACK ← 5008761: one retransmission fills the hole and the ACK jumps 5840 bytes at once"
      detail: >
        The retransmitted segment slots into the hole, the receiver's
        out-of-order queue merges, and all four segments are delivered to the
        application in one go. The cumulative ACK leaps from 5002921 straight
        to 5008761. Fast recovery ends: cwnd deflates to ssthresh (2 segments)
        and resumes congestion-avoidance growth from there — reduced, but
        never collapsed, and the transfer never went silent. Total recovery
        time: ~250 µs versus 204,000+ µs for the RTO path.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_una: "5008761"
              cwnd: "2"
              dup_acks_rcvd: 0
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              rcv_nxt: "5008761"
              ooo_queue: "empty"
              dup_acks_sent: 0
          - layer: 7
            name: "Application"
            state_fields:
              bytes_received: 8760

  - id: "evt_summary"
    type: "annotation"
    t_ns: 401000000
    annotation:
      text: "Scenario complete — the same loss, two recoveries: 204 ms vs 250 µs"
      detail: >
        Both losses were identical: one full segment, tail-dropped by the same
        congested switch queue. The recoveries could hardly be more different:

        • Loss with nothing in flight behind it → no duplicate ACKs possible →
          wait out the full RTO (204 ms) → cwnd collapses to 1 → slow start
          from scratch.

        • Loss inside a burst → 3 duplicate ACKs in ~130 µs → fast retransmit
          → cwnd halved (floor 2), transfer keeps flowing.

        Troubleshooting takeaways: in a capture, RTO retransmissions appear
        after a long silent gap, while fast retransmissions follow a visible
        train of duplicate ACKs. Wireshark labels them accordingly. Frequent
        RTOs mean your losses are hitting tail-of-burst or lone segments
        (or ACKs are being lost) — that pattern devastates throughput.
        And this whole dance is per-RTT: the longer the path, the more each
        recovery costs, which is why the same loss rate that is invisible on
        a LAN can halve throughput across a continent.

# ─────────────────────────────────────────────────────────────────
# GLOSSARY
# ─────────────────────────────────────────────────────────────────
glossary:
  - term: "Retransmission Timeout"
    abbrev: "RTO"
    definition: "The timer that guards every unacknowledged TCP segment. Computed as SRTT + 4×RTTVAR with a floor (~200 ms on Linux). When it expires, the oldest unacked segment is resent, cwnd collapses to 1, and the timer doubles. TCP's recovery of last resort."
    spec_refs:
      - document: "RFC 6298"
        section: "2"
        title: "Computing TCP's Retransmission Timer"
        url: "https://datatracker.ietf.org/doc/html/rfc6298#section-2"

  - term: "Duplicate ACK"
    abbrev: "dupACK"
    definition: "An ACK repeating the previous ACK number, sent when out-of-order data arrives. Cumulative ACKs cannot advance past a hole, so each later segment triggers another duplicate — turning the receiver into a loss reporter."
    spec_refs:
      - document: "RFC 5681"
        section: "2"
        title: "Definitions"
        url: "https://datatracker.ietf.org/doc/html/rfc5681#section-2"

  - term: "Fast Retransmit"
    definition: "On the third consecutive duplicate ACK, the sender retransmits the missing segment immediately instead of waiting for the RTO. Three is the threshold because one or two duplicates can be caused by benign reordering."
    spec_refs:
      - document: "RFC 5681"
        section: "3.2"
        title: "Fast Retransmit / Fast Recovery"
        url: "https://datatracker.ietf.org/doc/html/rfc5681#section-3.2"

  - term: "Fast Recovery"
    definition: "The milder congestion response paired with fast retransmit: ssthresh = half the data in flight (floor 2 segments), cwnd deflates to ssthresh instead of collapsing to 1, and slow start is skipped — because arriving duplicate ACKs prove the network is still delivering."
    spec_refs:
      - document: "RFC 5681"
        section: "3.2"
        title: "Fast Retransmit / Fast Recovery"
        url: "https://datatracker.ietf.org/doc/html/rfc5681#section-3.2"

  - term: "Selective Acknowledgment"
    abbrev: "SACK"
    definition: "TCP option carrying up to 3–4 blocks of received-but-out-of-order byte ranges. Turns 'something is missing' into 'exactly bytes X–Y are missing', letting the sender resend only the hole."
    spec_refs:
      - document: "RFC 2018"
        section: "3"
        title: "SACK Option Format"
        url: "https://datatracker.ietf.org/doc/html/rfc2018"

  - term: "Congestion Window"
    abbrev: "cwnd"
    definition: "Sender-side limit on unacknowledged data in flight. Grows on ACKs (slow start doubles per RTT; congestion avoidance adds ~1 segment per RTT), shrinks on loss (RTO → 1 segment; fast retransmit → ssthresh)."
    spec_refs:
      - document: "RFC 5681"
        section: "3.1"
        title: "Slow Start and Congestion Avoidance"
        url: "https://datatracker.ietf.org/doc/html/rfc5681#section-3.1"

  - term: "Slow Start Threshold"
    abbrev: "ssthresh"
    definition: "The cwnd level separating slow start (exponential growth) from congestion avoidance (linear growth). Set to half the flight size on each loss event, with a floor of 2 segments — the connection's memory of how much the path could carry."

  - term: "Karn's Algorithm"
    definition: "RTT samples must not be taken from retransmitted segments (the ACK is ambiguous — original or retransmission?). TCP timestamps remove the ambiguity, which is one reason modern stacks negotiate them on every connection."
    spec_refs:
      - document: "RFC 6298"
        section: "3"
        title: "Taking RTT Samples"
        url: "https://datatracker.ietf.org/doc/html/rfc6298#section-3"

# ─────────────────────────────────────────────────────────────────
# WALKTHROUGHS
# ─────────────────────────────────────────────────────────────────
walkthroughs:
  - id: "default"
    title: "One Loss, Two Recoveries"
    description: "Watch the same segment loss recovered two ways: a 204 ms retransmission timeout with congestion-window collapse, then a 250 µs fast retransmit triggered by duplicate ACKs"
    steps:
      - step: 0
        narration: >
          We join a healthy upload in progress: connection ESTABLISHED,
          congestion window at 10 segments, round trips of 120 microseconds.
          One number to hold onto: the retransmission timeout is 204
          milliseconds — Linux won't let it drop below ~200 ms no matter how
          fast the network. That timer is about to matter enormously.
        highlight_fields: []

      - step: 1
        narration: >
          A normal 1460-byte data segment goes out, carrying bytes
          5000001–5001460. The timestamp option stamps its departure time;
          when the ACK echoes it back, the sender gets a fresh RTT sample.
          Reliability bookkeeping runs on every single segment, loss or no
          loss.
        highlight_fields: ["tcp.seq", "tcp.options"]

      - step: 3
        narration: >
          The next segment isn't so lucky. The application happens to pause
          after this one — no more data queued for a while — so bytes
          5001461–5002920 travel alone. At the switch, a microburst from
          another port has filled the egress queue: tail-drop. The arrow stops
          at the switch. Neither endpoint knows anything yet.
        highlight_fields: ["tcp.seq"]

      - step: 5
        narration: >
          Now the trap: duplicate ACKs — TCP's fast loss detector — need later
          segments to jog the receiver into repeating itself. There are no
          later segments. The receiver waits silently for byte 5001461; the
          sender waits for an ACK. The only thing moving is the 204 ms
          retransmission timer.
        highlight_fields: []

      - step: 6
        narration: >
          The timer finally expires: 204 milliseconds — roughly 1,700 round
          trips — of dead air. The RTO is deliberately conservative because a
          spurious timeout would retransmit needlessly and punish the
          congestion window for nothing. Patience is the price of certainty.
        highlight_fields: []

      - step: 7
        narration: >
          The retransmission goes out: identical sequence number 5001461 —
          that repetition is how you spot retransmits in any capture. And the
          penalty lands: cwnd collapses from 10 segments to 1, ssthresh drops
          to 2, and the RTO doubles to 408 ms in case this copy dies too.
          TCP treats a timeout as evidence of serious trouble.
        highlight_fields: ["tcp.seq", "tcp.options"]

      - step: 8
        narration: >
          The ACK arrives 120 µs later — recovery complete, at a cost of 204 ms
          of stall plus a congestion window rebuilt from scratch. On this LAN
          the rebuild takes a millisecond; on an 80 ms Internet path the
          identical loss would cost over half a second of degraded throughput.
        highlight_fields: ["tcp.ack"]

      - step: 9
        narration: >
          Fast forward 100 ms: cwnd has climbed back to 10 (slow start to
          ssthresh, then one segment per round trip), and the application hands
          TCP four segments' worth of data at once. The same congested queue is
          waiting — but this time the loss will have witnesses.
        highlight_fields: []

      - step: 10
        narration: >
          First segment of the burst — bytes 5002921–5004380 — is tail-dropped
          at the switch, exactly like before. The difference: segments 4, 5,
          and 6 are microseconds behind it, and they get through.
        highlight_fields: ["tcp.seq"]

      - step: 12
        narration: >
          Segment 4 lands at the receiver, which expected byte 5002921 but got
          5004381. It buffers the bytes in its out-of-order queue (in-order
          delivery is TCP's contract with the application) and immediately
          repeats its ACK for 5002921 — now with a SACK block saying exactly
          which bytes it holds. The hole has been spotted within microseconds.
        highlight_fields: ["tcp.seq"]

      - step: 15
        narration: >
          Duplicate ACK #1: the ACK number is frozen at 5002921, and the SACK
          block reads 5004381–5005841. Subtract: exactly one segment is
          missing. One duplicate could still be reordering, so the sender just
          counts it. Segments 5 and 6 will produce duplicates #2 and #3 within
          the next 20 microseconds.
        highlight_fields: ["tcp.ack", "tcp.options.sack"]

      - step: 17
        narration: >
          Duplicate ACK #3 — the threshold from RFC 5681. Three repetitions
          means lost, not reordered. The sender takes the milder penalty of
          fast recovery: ssthresh = half the flight (floor of 2), cwnd deflates
          toward it, but no collapse to 1 and no slow start — the duplicate
          ACKs themselves prove the network is still delivering packets.
        highlight_fields: ["tcp.ack", "tcp.options.sack"]

      - step: 18
        narration: >
          Fast retransmit: sequence 5002921 goes out again, about 135
          microseconds after the original — versus 204,000 microseconds for
          the RTO path. Same network, same kind of loss, ~1,500× faster
          recovery, purely because the loss happened inside a burst instead of
          at the end of one.
        highlight_fields: ["tcp.seq"]

      - step: 19
        narration: >
          The retransmitted bytes slot into the hole and everything buffered
          behind it becomes deliverable at once: the ACK leaps from 5002921
          straight to 5008761 — 5,840 bytes acknowledged by one segment's
          arrival. cwnd settles at ssthresh and resumes linear growth. Total
          outage: ~250 µs, and the transfer never went quiet.
        highlight_fields: ["tcp.ack"]

      - step: 20
        narration: >
          The takeaway table: RTO recovery = long silent gap in the capture,
          cwnd to 1, slow start from scratch. Fast retransmit = a visible train
          of duplicate ACKs, cwnd halved, transfer keeps moving. When you see
          frequent RTOs in a trace, ask what is killing lone segments or
          ACKs; when you see dupACK trains, you are watching TCP work as
          designed. Either way, loss costs multiply with round-trip time —
          the LAN shrugs off what would cripple a transcontinental link.
        highlight_fields: []
