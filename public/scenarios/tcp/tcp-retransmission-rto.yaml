meta:
  id: "tcp-retransmission-rto"
  title: "TCP Error: Retransmission — RTO Timeout vs Fast Retransmit"
  protocol: "TCP"
  protocol_family: "TCP/IP"
  version: "1.0.0"
  description: >
    Error scenario: a data segment is lost mid-transfer — twice — and TCP
    recovers two very different ways. The first loss happens with nothing else
    in flight, so the sender can only wait for the retransmission timeout
    (RTO): ~200 ms of dead air on a network with a 120 µs round trip, followed
    by a congestion-window collapse to 1 segment. The second loss happens
    inside a burst, so the segments behind it generate duplicate ACKs, and the
    third dupACK triggers fast retransmit about 1,500× sooner — with the
    congestion window merely halved. This is the machinery that makes TCP
    reliable, and the reason loss hurts throughput far more than latency does.

  learning_objectives:
    - "See what happens on the wire when a TCP data segment is silently dropped by a congested switch"
    - "Understand the retransmission timeout (RTO): how it is computed (SRTT + 4×RTTVAR, floored at 200 ms on Linux) and why it is deliberately conservative"
    - "Watch the congestion window collapse to 1 MSS after an RTO and rebuild through slow start"
    - "Understand duplicate ACKs: why the receiver repeats the same ACK number when it holds out-of-order data"
    - "See the three-dupACK threshold trigger fast retransmit long before the RTO would fire"
    - "Read SACK blocks and see how they tell the sender exactly which bytes survived"
    - "Contrast the two recoveries: RTO → cwnd = 1 + slow start; fast retransmit → cwnd halved + congestion avoidance"

  difficulty: "beginner"

  authors:
    - name: "ProtoViz Community"
      org: "proto-viz"
      github: "proto-viz"

  created: "2026-08-12"
  updated: "2026-08-12"

  tags:
    - "TCP"
    - "TCP/IP"
    - "error"
    - "troubleshooting"
    - "retransmission"
    - "RTO"
    - "fast retransmit"
    - "duplicate ACK"
    - "SACK"
    - "congestion control"
    - "beginner"
    - "education"

  primary_specs:
    - document: "RFC 6298"
      section: "2"
      title: "Computing TCP's Retransmission Timer"
      url: "https://datatracker.ietf.org/doc/html/rfc6298#section-2"
      alt_url: ""
    - document: "RFC 5681"
      section: "3.2"
      title: "Fast Retransmit / Fast Recovery"
      url: "https://datatracker.ietf.org/doc/html/rfc5681#section-3.2"
      alt_url: ""
    - document: "RFC 2018"
      section: "3"
      title: "SACK Option Format"
      url: "https://datatracker.ietf.org/doc/html/rfc2018"
      alt_url: ""

  content_disclaimer: >
    Protocol descriptions in this scenario are based on open-source implementations
    (Linux kernel, Wireshark dissectors) and public RFCs. No proprietary specification
    text has been reproduced. RFC references are provided as citations for further reading.

  source_references:
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_timer.c"
      description: "tcp_retransmit_timer — RTO expiry handling"
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_input.c"
      description: "tcp_fastretrans_alert — dupACK counting and fast retransmit"
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_output.c"
      description: "tcp_retransmit_skb — segment retransmission"

# ─────────────────────────────────────────────────────────────────
# TOPOLOGY
# ─────────────────────────────────────────────────────────────────
topology:
  actors:
    - id: "client"
      type: "host"
      label: "Client (sender)"
      description: "TCP sender — uploading a 1 MB file; owns the retransmission timers and the congestion window"
      hardware: "Generic 10GbE NIC"
      os: "Linux 6.x"
      kernel_version: "6.8"
      ip: "10.0.1.10"
      mac: "00:11:22:33:44:01"
      position: "left"

    - id: "switch"
      type: "switch"
      label: "10GbE Switch"
      description: "Layer-2 switch with a briefly congested egress queue — where both losses happen"
      hardware: "Generic 10GbE switch, shallow buffers"
      position: "center"

    - id: "server"
      type: "host"
      label: "Server (receiver)"
      description: "TCP receiver — generates ACKs, duplicate ACKs, and SACK blocks"
      hardware: "Generic 10GbE NIC"
      os: "Linux 6.x"
      kernel_version: "6.8"
      ip: "10.0.1.20"
      mac: "00:11:22:33:44:02"
      position: "right"

  links:
    - id: "link-c-sw"
      from: "client"
      to: "switch"
      speed_gbps: 10
      media: "copper_dac"
      fec: "FC-FEC"
      autoneg: true
    - id: "link-sw-s"
      from: "switch"
      to: "server"
      speed_gbps: 10
      media: "copper_dac"
      fec: "FC-FEC"
      autoneg: true

# ─────────────────────────────────────────────────────────────────
# OSI LAYER DEFINITIONS (per actor)
# ─────────────────────────────────────────────────────────────────
osi_layers:
  client:
    - layer: 7
      name: "Application"
      components: ["file upload client", "libc socket API"]
      state_schema:
        app_state:
          type: "string"
          description: "Application-level state"
          initial: "uploading"
        bytes_queued:
          type: "string"
          description: "Data queued in the socket send buffer"
          initial: "~1 MB"

    - layer: 4
      name: "TCP"
      components: ["net/ipv4/tcp_output.c", "net/ipv4/tcp_timer.c", "net/ipv4/tcp_input.c"]
      state_schema:
        tcp_state:
          type: "string"
          description: "TCP state machine state"
          initial: "ESTABLISHED"
        snd_nxt:
          type: "string"
          description: "Next sequence number to send (SND.NXT)"
          initial: "5000001"
        snd_una:
          type: "string"
          description: "Oldest unacknowledged byte (SND.UNA)"
          initial: "5000001"
        cwnd:
          type: "string"
          description: "Congestion window (segments of 1460 B)"
          initial: "10"
        ssthresh:
          type: "string"
          description: "Slow start threshold (segments)"
          initial: "—"
        rto_ms:
          type: "string"
          description: "Current retransmission timeout"
          initial: "204"
        dup_acks_rcvd:
          type: "integer"
          description: "Consecutive duplicate ACKs for SND.UNA"
          initial: 0

    - layer: 3
      name: "IP / Routing"
      components: ["net/ipv4/ip_output.c"]
      state_schema:
        src_ip:
          type: "string"
          initial: "10.0.1.10"
        dst_ip:
          type: "string"
          initial: "10.0.1.20"
        ttl:
          type: "integer"
          initial: 64

    - layer: 2
      name: "Ethernet"
      components: ["NIC driver", "IEEE 802.3"]
      state_schema:
        link_state:
          type: "string"
          initial: "up"
        mac_addr:
          type: "string"
          initial: "00:11:22:33:44:01"

    - layer: 1
      name: "Physical (10GbE)"
      components: ["IEEE 802.3", "10GBASE-CR"]
      state_schema:
        phy_state:
          type: "string"
          initial: "up"
        speed:
          type: "string"
          initial: "10 Gbps"

  server:
    - layer: 7
      name: "Application"
      components: ["file upload service"]
      state_schema:
        app_state:
          type: "string"
          description: "Application-level state"
          initial: "receiving"
        bytes_received:
          type: "integer"
          description: "In-order bytes delivered to the application"
          initial: 0

    - layer: 4
      name: "TCP"
      components: ["net/ipv4/tcp_input.c"]
      state_schema:
        tcp_state:
          type: "string"
          description: "TCP state machine state"
          initial: "ESTABLISHED"
        rcv_nxt:
          type: "string"
          description: "Next expected sequence number (RCV.NXT)"
          initial: "5000001"
        ooo_queue:
          type: "string"
          description: "Out-of-order bytes held, waiting for the hole to fill"
          initial: "empty"
        dup_acks_sent:
          type: "integer"
          description: "Duplicate ACKs sent for the current hole"
          initial: 0

    - layer: 3
      name: "IP / Routing"
      components: ["net/ipv4/ip_input.c"]
      state_schema:
        src_ip:
          type: "string"
          initial: "10.0.1.20"
        dst_ip:
          type: "string"
          initial: "10.0.1.10"
        ttl:
          type: "integer"
          initial: 64

    - layer: 2
      name: "Ethernet"
      components: ["NIC driver", "IEEE 802.3"]
      state_schema:
        link_state:
          type: "string"
          initial: "up"
        mac_addr:
          type: "string"
          initial: "00:11:22:33:44:02"

    - layer: 1
      name: "Physical (10GbE)"
      components: ["IEEE 802.3", "10GBASE-CR"]
      state_schema:
        phy_state:
          type: "string"
          initial: "up"
        speed:
          type: "string"
          initial: "10 Gbps"

# ─────────────────────────────────────────────────────────────────
# FRAMES
# ─────────────────────────────────────────────────────────────────
frames:
  # ── Healthy baseline ─────────────────────────────────────────────
  - id: "tcp_data_seg1"
    name: "TCP Data (seg 1)"
    description: "A healthy 1460-byte data segment — the baseline this scenario measures failure against"
    from: "client"
    to: "server"
    via: ["switch"]
    timestamp_ns: 100000000
    total_bytes: 1526
    color: "#0369a1"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Server's MAC"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            description: "IPv4"
      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Total Length"
            abbrev: "ip.len"
            bits: 16
            value: 1512
            description: "IP header (20) + TCP header with timestamps (32) + payload (1460)"
          - name: "Identification"
            abbrev: "ip.id"
            bits: 16
            value: "0xc101"
            description: "Unique per datagram"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.10"
            description: "Client (sender)"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.20"
            description: "Server (receiver)"
      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 32
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 49300
            description: "Client's ephemeral port"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
            value: 80
            description: "Server's service port"
          - name: "Sequence Number"
            abbrev: "tcp.seq"
            bits: 32
            value: 5000001
            value_hex: "0x004c4b41"
            description: "First byte of this segment; carries bytes 5000001–5001460"
            spec_refs:
              - document: "RFC 9293"
                section: "3.4"
                title: "Sequence Numbers"
                url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.4"
          - name: "Acknowledgment Number"
            abbrev: "tcp.ack"
            bits: 32
            value: 8000001
            description: "Nothing new expected from the server — this direction is a one-way upload"
          - name: "Flags"
            abbrev: "tcp.flags"
            bits: 8
            value: "0x10"
            description: "ACK only — a mid-stream data segment"
            fields:
              - name: "ACK"
                abbrev: "tcp.flags.ack"
                bits: 1
                value: 1
                description: "Acknowledgment field valid (always set after the handshake)"
              - name: "PSH"
                abbrev: "tcp.flags.push"
                bits: 1
                value: 0
                description: "More data follows immediately"
          - name: "Window Size"
            abbrev: "tcp.window_size"
            bits: 16
            value: 65535
            description: "Client's receive window (unused direction)"
          - name: "Checksum"
            abbrev: "tcp.checksum"
            bits: 16
            value: "0x1a2b"
            description: "TCP checksum"
          - name: "Options"
            abbrev: "tcp.options"
            bits: 96
            value: "Timestamps (TSval=200000, TSecr=310000)"
            description: "Timestamps on every segment enable per-segment RTT measurement — the input to the RTO calculation"
          - name: "Payload"
            abbrev: "tcp.payload"
            bits: 11680
            value: "1460 bytes of file data"
            description: "Bytes 5000001–5001460 of the upload"

  - id: "tcp_data_ack1"
    name: "TCP ACK 5001461"
    description: "Receiver acknowledges segment 1 — the healthy round trip takes ~120 µs"
    from: "server"
    to: "client"
    via: ["switch"]
    timestamp_ns: 100120000
    total_bytes: 66
    color: "#0369a1"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Server's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            description: "IPv4"
      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Total Length"
            abbrev: "ip.len"
            bits: 16
            value: 52
            description: "IP header (20) + TCP header with timestamps (32), no payload"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.20"
            description: "Server (receiver)"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.10"
            description: "Client (sender)"
      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 32
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 80
            description: "Server's service port"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
            value: 49300
            description: "Client's ephemeral port"
          - name: "Sequence Number"
            abbrev: "tcp.seq"
            bits: 32
            value: 8000001
            description: "Server sends no data of its own"
          - name: "Acknowledgment Number"
            abbrev: "tcp.ack"
            bits: 32
            value: 5001461
            value_hex: "0x004c5115"
            description: "Cumulative ACK: every byte through 5001460 received; byte 5001461 expected next"
            spec_refs:
              - document: "RFC 9293"
                section: "3.4"
                title: "Sequence Numbers"
                url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.4"
          - name: "Flags"
            abbrev: "tcp.flags"
            bits: 8
            value: "0x10"
            description: "ACK"
            fields:
              - name: "ACK"
                abbrev: "tcp.flags.ack"
                bits: 1
                value: 1
                description: "Acknowledgment field valid"
          - name: "Window Size"
            abbrev: "tcp.window_size"
            bits: 16
            value: 65535
            description: "Receiver has ample buffer space"
          - name: "Checksum"
            abbrev: "tcp.checksum"
            bits: 16
            value: "0x3c4d"
            description: "TCP checksum"
          - name: "Options"
            abbrev: "tcp.options"
            bits: 96
            value: "Timestamps (TSval=310060, TSecr=200000)"
            description: "TSecr echoes the segment's TSval — this is how the sender measures RTT per segment"

  # ── Loss #1: nothing in flight behind it → RTO ───────────────────
  - id: "tcp_data_seg2"
    name: "TCP Data (seg 2) — LOST"
    description: "Bytes 5001461–5002920 — discarded by the switch's overflowing egress queue; the arrow stops at the switch because the segment never gets past it"
    from: "client"
    to: "switch"
    via: []
    timestamp_ns: 100200000
    total_bytes: 1526
    color: "#0369a1"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Addressed to the server — the client has no idea this frame is doomed"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            description: "IPv4"
      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Total Length"
            abbrev: "ip.len"
            bits: 16
            value: 1512
            description: "IP header (20) + TCP header (32) + payload (1460)"
          - name: "Identification"
            abbrev: "ip.id"
            bits: 16
            value: "0xc102"
            description: "Unique per datagram"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.10"
            description: "Client (sender)"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.20"
            description: "Server (receiver) — never reached"
      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 32
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 49300
            description: "Client's ephemeral port"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
            value: 80
            description: "Server's service port"
          - name: "Sequence Number"
            abbrev: "tcp.seq"
            bits: 32
            value: 5001461
            value_hex: "0x004c5115"
            description: "Bytes 5001461–5002920 — this sequence number will appear again in the retransmission"
          - name: "Acknowledgment Number"
            abbrev: "tcp.ack"
            bits: 32
            value: 8000001
            description: "Unchanged"
          - name: "Flags"
            abbrev: "tcp.flags"
            bits: 8
            value: "0x10"
            description: "ACK only"
            fields:
              - name: "ACK"
                abbrev: "tcp.flags.ack"
                bits: 1
                value: 1
                description: "Acknowledgment field valid"
          - name: "Window Size"
            abbrev: "tcp.window_size"
            bits: 16
            value: 65535
            description: "Unchanged"
          - name: "Checksum"
            abbrev: "tcp.checksum"
            bits: 16
            value: "0x2b3c"
            description: "TCP checksum — valid; the loss has nothing to do with corruption"
          - name: "Options"
            abbrev: "tcp.options"
            bits: 96
            value: "Timestamps (TSval=200200, TSecr=310060)"
            description: "Timestamps present as always"
          - name: "Payload"
            abbrev: "tcp.payload"
            bits: 11680
            value: "1460 bytes of file data"
            description: "Bytes 5001461–5002920 — these bytes exist only in the client's retransmit buffer now"

  - id: "tcp_rto_retx_seg2"
    name: "TCP RTO Retransmission (seg 2)"
    description: "The same 1460 bytes, resent 204 ms later when the retransmission timer finally expired"
    from: "client"
    to: "server"
    via: ["switch"]
    timestamp_ns: 304400000
    total_bytes: 1526
    color: "#d97706"
    headers:
      - name: "Ethernet II"
        abbrev: "eth"
        layer: 2
        total_bytes: 14
        fields:
          - name: "Destination MAC"
            abbrev: "eth.dst"
            bits: 48
            value: "00:11:22:33:44:02"
            description: "Server's MAC"
          - name: "Source MAC"
            abbrev: "eth.src"
            bits: 48
            value: "00:11:22:33:44:01"
            description: "Client's MAC"
          - name: "EtherType"
            abbrev: "eth.type"
            bits: 16
            value: "0x0800"
            description: "IPv4"
      - name: "IPv4"
        abbrev: "ip"
        layer: 3
        total_bytes: 20
        fields:
          - name: "Total Length"
            abbrev: "ip.len"
            bits: 16
            value: 1512
            description: "Same size as the lost original"
          - name: "Identification"
            abbrev: "ip.id"
            bits: 16
            value: "0xc103"
            description: "New IP ID — a new datagram carrying the same TCP bytes"
          - name: "TTL"
            abbrev: "ip.ttl"
            bits: 8
            value: 64
            description: "Time To Live"
          - name: "Protocol"
            abbrev: "ip.proto"
            bits: 8
            value: 6
            description: "TCP"
          - name: "Source IP"
            abbrev: "ip.src"
            bits: 32
            value: "10.0.1.10"
            description: "Client (sender)"
          - name: "Destination IP"
            abbrev: "ip.dst"
            bits: 32
            value: "10.0.1.20"
            description: "Server (receiver)"
      - name: "TCP"
        abbrev: "tcp"
        layer: 4
        total_bytes: 32
        fields:
          - name: "Source Port"
            abbrev: "tcp.srcport"
            bits: 16
            value: 49300
            description: "Same connection"
          - name: "Destination Port"
            abbrev: "tcp.dstport"
            bits: 16
            value: 80
            description: "Same connection"
          - name: "Sequence Number"
            abbrev: "tcp.seq"
            bits: 32
            value: 5001461
            value_hex: "0x004c5115"
            description: "Identical to the lost segment — a retransmission is recognizable in a capture precisely because the sequence number repeats"
            spec_refs:
              - document: "RFC 6298"
                section: "5"
                title: "Managing the RTO Timer"
                url: "https://datatracker.ietf.org/doc/html/rfc6298#section-5"
            kernel_ref:
              file: "net/ipv4/tcp_output.c"
              function: "tcp_retransmit_skb"
              notes: "Rebuilds and resends the segment at the head of the retransmit queue"
          - name: "Acknowledgment Number"
            abbrev: "tcp.ack"
            bits: 32
            value: 8000001
            description: "Unchanged"
          - name: "Flags"
            abbrev: "tcp.flags"
            bits: 8
            value: "0x10"
            description: "ACK only — retransmissions carry no special flag; only the repeated sequence number gives them away"
            fields:
              - name: "ACK"
                abbrev: "tcp.flags.ack"
                bits: 1
                value: 1
                description: "Acknowledgment field valid"
          - name: "Window Size"
            abbrev: "tcp.window_size"
            bits: 16
            value: 65535
            description: "Unchanged"
          - name: "Checksum"
            abbrev: "tcp.checksum"
