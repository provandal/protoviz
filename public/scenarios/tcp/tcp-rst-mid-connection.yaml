meta:
  id: "tcp-rst-mid-connection"
  title: "TCP Error: RST Mid-Connection vs Graceful FIN"
  protocol: "TCP"
  protocol_family: "TCP/IP"
  version: "1.0.0"
  description: >
    Error scenario: a healthy, established connection is killed by a reset.
    A monitoring client polls a server over a long-lived connection; mid-poll,
    the server process crashes with 120 unread bytes stranded in its socket
    buffer, and the kernel aborts the connection with RST — the client's next
    read fails with ECONNRESET. The scenario then rewinds and shows the same
    session ending the polite way: the 4-way FIN teardown with TIME_WAIT.
    Along the way: who really sends RSTs in production (crashed apps,
    restarted servers, firewalls, load-balancer idle timeouts), and why
    "Connection reset by peer" and a broken-pipe error are two views of the
    same event.

  learning_objectives:
    - "See what an in-connection RST looks like on the wire and how it differs from a FIN"
    - "Understand why closing a socket with unread data triggers RST instead of FIN (RFC 1122 §4.2.2.13)"
    - "Trace how a crashed process leads to 'Connection reset by peer' (ECONNRESET) on the other side"
    - "Learn the difference between ECONNRESET (read after RST) and EPIPE/SIGPIPE (send after RST)"
    - "Contrast the abortive close with the graceful 4-way FIN teardown and TIME_WAIT"
    - "Recognize the other common RST sources in production: server restarts, stateful firewalls, and load-balancer idle timeouts"
    - "Know why a FIN promises delivery of everything sent, while an RST guarantees nothing"

  difficulty: "beginner"

  authors:
    - name: "ProtoViz Community"
      org: "proto-viz"
      github: "proto-viz"

  created: "2026-08-12"
  updated: "2026-08-12"

  tags:
    - "TCP"
    - "TCP/IP"
    - "error"
    - "troubleshooting"
    - "RST"
    - "ECONNRESET"
    - "FIN"
    - "TIME_WAIT"
    - "connection teardown"
    - "load balancer"
    - "beginner"
    - "education"

  primary_specs:
    - document: "RFC 9293"
      section: "3.5.2"
      title: "Reset Generation"
      url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.2"
      alt_url: "https://www.rfc-editor.org/rfc/rfc9293"
    - document: "RFC 1122"
      section: "4.2.2.13"
      title: "Closing a Connection — data pending means RST"
      url: "https://datatracker.ietf.org/doc/html/rfc1122#section-4.2.2.13"
      alt_url: ""
    - document: "RFC 9293"
      section: "3.6"
      title: "Closing a Connection"
      url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.6"
      alt_url: ""

  content_disclaimer: >
    Protocol descriptions in this scenario are based on open-source implementations
    (Linux kernel, Wireshark dissectors) and public RFCs. No proprietary specification
    text has been reproduced. RFC references are provided as citations for further reading.

  source_references:
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp.c"
      description: "tcp_close — sends RST when the receive queue still holds unread data"
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_output.c"
      description: "tcp_send_active_reset — abortive close RST generation"
    - repo: "torvalds/linux"
      path: "net/ipv4/tcp_input.c"
      description: "tcp_reset — handling a received RST, setting sk_err to ECONNRESET"

# ─────────────────────────────────────────────────────────────────
# TOPOLOGY
# ─────────────────────────────────────────────────────────────────
topology:
  actors:
    - id: "client"
      type: "host"
      label: "Monitoring Client"
      description: "Polls the server's /status endpoint every 2 seconds over one long-lived TCP connection"
      hardware: "Generic 10GbE NIC"
      os: "Linux 6.x"
      kernel_version: "6.8"
      ip: "10.0.1.10"
      mac: "00:11:22:33:44:01"
      position: "left"

    - id: "switch"
      type: "switch"
      label: "10GbE Switch"
      description: "Layer-2 Ethernet switch — an innocent bystander in this scenario"
      hardware: "Generic 10GbE switch"
      position: "center"

    - id: "server"
      type: "host"
      label: "Server"
      description: "Runs the status service — until the process crashes mid-poll"
      hardware: "Generic 10GbE NIC"
      os: "Linux 6.x"
      kernel_version: "6.8"
      ip: "10.0.1.20"
      mac: "00:11:22:33:44:02"
      position: "right"

  links:
    - id: "link-c-sw"
      from: "client"
      to: "switch"
      speed_gbps: 10
      media: "copper_dac"
      fec: "FC-FEC"
      autoneg: true
    - id: "link-sw-s"
      from: "switch"
      to: "server"
      speed_gbps: 10
      media: "copper_dac"
      fec: "FC-FEC"
      autoneg: true

# ─────────────────────────────────────────────────────────────────
# OSI LAYER DEFINITIONS (per actor)
# ─────────────────────────────────────────────────────────────────
osi_layers:
  client:
    - layer: 7
      name: "Application"
      components: ["monitoring agent", "libc socket API"]
      state_schema:
        app_state:
          type: "string"
          description: "Application-level state"
          initial: "polling every 2 s"
        errno:
          type: "string"
          description: "Last error returned by a socket call"
          initial: "—"

    - layer: 4
      name: "TCP"
      components: ["net/ipv4/tcp.c", "net/ipv4/tcp_input.c"]
      state_schema:
        tcp_state:
          type: "string"
          description: "TCP state machine state (RFC 9293 §3.3.2)"
          initial: "ESTABLISHED"
        snd_nxt:
          type: "string"
          description: "Next sequence number to send (SND.NXT)"
          initial: "6000001"
        rcv_nxt:
          type: "string"
          description: "Next sequence number expected (RCV.NXT)"
          initial: "9000001"

    - layer: 3
      name: "IP / Routing"
      components: ["net/ipv4/ip_output.c"]
      state_schema:
        src_ip:
          type: "string"
          initial: "10.0.1.10"
        dst_ip:
          type: "string"
          initial: "10.0.1.20"
        ttl:
          type: "integer"
          initial: 64

    - layer: 2
      name: "Ethernet"
      components: ["NIC driver", "IEEE 802.3"]
      state_schema:
        link_state:
          type: "string"
          initial: "up"
        mac_addr:
          type: "string"
          initial: "00:11:22:33:44:01"

    - layer: 1
      name: "Physical (10GbE)"
      components: ["IEEE 802.3", "10GBASE-CR"]
      state_schema:
        phy_state:
          type: "string"
          initial: "up"
        speed:
          type: "string"
          initial: "10 Gbps"

  server:
    - layer: 7
      name: "Application"
      components: ["status service (PID 4242)", "libc socket API"]
      state_schema:
        app_state:
          type: "string"
          description: "Application-level state"
          initial: "serving /status"
        process:
          type: "string"
          description: "The process owning the connected socket"
          initial: "PID 4242, running"

    - layer: 4
      name: "TCP"
      components: ["net/ipv4/tcp.c", "net/ipv4/tcp_output.c"]
      state_schema:
        tcp_state:
          type: "string"
          description: "TCP state machine state (RFC 9293 §3.3.2)"
          initial: "ESTABLISHED"
        snd_nxt:
          type: "string"
          description: "Next sequence number to send (SND.NXT)"
          initial: "9000001"
        rcv_nxt:
          type: "string"
          description: "Next sequence number expected (RCV.NXT)"
          initial: "6000001"
        recv_queue:
          type: "string"
          description: "Bytes received by the kernel but not yet read by the application"
          initial: "empty"

    - layer: 3
      name: "IP / Routing"
      components: ["net/ipv4/ip_output.c"]
      state_schema:
        src_ip:
          type: "string"
          initial: "10.0.1.20"
        dst_ip:
          type: "string"
          initial: "10.0.1.10"
        ttl:
          type: "integer"
          initial: 64

    - layer: 2
      name: "Ethernet"
      components: ["NIC driver", "IEEE 802.3"]
      state_schema:
        link_state:
          type: "string"
          initial: "up"
        mac_addr:
          type: "string"
          initial: "00:11:22:33:44:02"

    - layer: 1
