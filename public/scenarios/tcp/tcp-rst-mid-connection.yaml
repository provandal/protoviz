# ─────────────────────────────────────────────────────────────────
# TIMELINE
# ─────────────────────────────────────────────────────────────────
timeline:
  # ── Phase: healthy long-lived connection ─────────────────────────
  - id: "evt_tcp_data_setup"
    type: "state_change"
    t_ns: 0
    annotation:
      text: "A long-lived connection: the monitoring client polls the server's status endpoint every 2 seconds"
      detail: >
        The connection was established hours ago (see the foundation scenario
        for the handshake) and reused for thousands of polls — connection
        reuse avoids paying the handshake latency on every poll. Client and
        server both sit in ESTABLISHED with their sequence numbers deep into
        the megabytes. The status service runs as PID 4242 on the server.
        Everything works — until it doesn't.

  - id: "evt_tcp_data_req1"
    type: "frame_tx"
    t_ns: 100000000
    frame_id: "tcp_data_req1"
    annotation:
      text: "TCP PSH+ACK → poll #1: GET /status (120 bytes)"
      detail: >
        An ordinary poll: 120 bytes of HTTP carried in one segment, PSH set so
        the server's stack hands it to the application immediately. Sequence
        accounting: bytes 6000001–6000120 of the client's stream.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_nxt: "6000121"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              rcv_nxt: "6000121"
              recv_queue: "empty (read by app)"

  - id: "evt_tcp_data_resp1"
    type: "frame_tx"
    t_ns: 100150000
    frame_id: "tcp_data_resp1"
    annotation:
      text: "TCP PSH+ACK ← 200 OK (310 bytes): all systems healthy"
      detail: >
        The status service reads the poll, checks its internals, and answers
        with a small JSON body. The ACK number (6000121) confirms the poll;
        the payload occupies bytes 9000001–9000310 of the server's stream.
        Round trip: 150 µs. This is poll number ~3,600 on this connection.
    state_after:
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_nxt: "9000311"
          - layer: 7
            name: "Application"
            state_fields:
              app_state: "answered poll, idle"

  - id: "evt_tcp_data_ack1"
    type: "frame_tx"
    t_ns: 100200000
    frame_id: "tcp_data_ack1"
    annotation:
      text: "TCP ACK → 9000311: poll complete, connection idles until the next cycle"
      detail: >
        The client acknowledges the answer and goes back to sleep for 2
        seconds. Note what "idle" means for TCP: nothing. No keepalives at
        this timescale, no probes — an idle TCP connection exchanges zero
        packets. Both endpoints simply remember their state. This silence is
        why half-dead connections can linger undetected, and why the crash
        coming next needs the *next* poll to reveal itself.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              rcv_nxt: "9000311"
          - layer: 7
            name: "Application"
            state_fields:
              app_state: "sleeping until next poll"

  # ── Phase: the crash and the reset ───────────────────────────────
  - id: "evt_tcp_data_req2"
    type: "frame_tx"
    t_ns: 2000000000
    frame_id: "tcp_data_req2"
    annotation:
      text: "TCP PSH+ACK → poll #2 leaves on schedule — 120 bytes headed for a process with microseconds to live"
      detail: >
        Two seconds later, the next poll goes out, byte-identical in structure
        to thousands before it. The server's kernel receives it, ACKs it
        internally, and queues the 120 bytes in the socket's receive buffer
        for the application to read. The application never will.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              snd_nxt: "6000241"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              rcv_nxt: "6000241"
              recv_queue: "120 bytes, unread"

  - id: "evt_tcp_rst_crash"
    type: "state_change"
    t_ns: 2000050000
    annotation:
      text: "The status service crashes (SIGSEGV) — the kernel must now dispose of a socket holding 120 unread bytes"
      detail: >
        A bug fires: PID 4242 dereferences a bad pointer and dies with
        SIGSEGV. The kernel cleans up everything the process owned, including
        the connected socket. Here is the fork in the road: if the socket's
        receive queue were empty, the kernel would close gracefully with a
        FIN. But 120 bytes sit unread in the queue — and RFC 1122 §4.2.2.13
        is explicit: closing with received data still pending must send a
        reset, because a FIN would falsely promise the peer that everything
        it sent was delivered to the application. It wasn't.
      spec_refs:
        - document: "RFC 1122"
          section: "4.2.2.13"
          title: "Closing a Connection"
          url: "https://datatracker.ietf.org/doc/html/rfc1122#section-4.2.2.13"
    state_after:
      - actor_id: "server"
        layers:
          - layer: 7
            name: "Application"
            state_fields:
              app_state: "CRASHED"
              process: "PID 4242, dead (SIGSEGV)"

  - id: "evt_tcp_rst_frame"
    type: "frame_tx"
    t_ns: 2000100000
    frame_id: "tcp_rst_frame"
    annotation:
      text: "TCP RST+ACK ← abort, not goodbye: the connection ceases to exist immediately"
      detail: >
        tcp_send_active_reset() builds the abort: RST+ACK with SEQ = SND.NXT
        (9000311, so the client will accept it as in-window) and ACK = 6000241
        (the kernel did receive the poll — it just has nowhere to deliver it).
        Unlike FIN, a reset is not negotiated and not acknowledged. There is
        no half-close, no waiting, no TIME_WAIT: one segment, and the
        connection is gone in both directions.

        The in-window requirement is TCP's defense against off-path attackers
        blindly injecting resets — a wrong sequence number and the RST is
        ignored (RFC 9293 §3.5.3, born from the RST-injection attacks
        catalogued in RFC 5961).
      spec_refs:
        - document: "RFC 9293"
          section: "3.5.3"
          title: "Reset Processing"
          url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.3"
    state_after:
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "CLOSED"
              recv_queue: "discarded"
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "CLOSED"

  - id: "evt_tcp_rst_econnreset"
    type: "error"
    t_ns: 2000150000
    annotation:
      text: "Client's recv() fails: ECONNRESET — 'Connection reset by peer'"
      detail: >
        The client kernel validates the RST (in-window: yes), destroys its
        side of the connection, and marks the socket with sk_err =
        ECONNRESET. The blocked recv() wakes with the famous error. Had the
        application tried to send instead, it would get EPIPE plus SIGPIPE —
        same event, different syscall, which is why the same outage produces
        different error strings in different services' logs.

        The other usual suspects for mid-connection RSTs, when nothing
        crashed: a server that restarted (all TCP state lost — anything
        arriving for the old connection draws a reset), a stateful firewall
        whose session entry expired, and load balancers enforcing idle
        timeouts (the classic: cloud LBs reset flows idle longer than ~350 s).
        If polls fail every N minutes on the dot, suspect an idle timer —
        the fix is TCP keepalives or application-level pings shorter than the
        timeout.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 7
            name: "Application"
            state_fields:
              app_state: "poll failed"
              errno: "ECONNRESET"

  # ── Phase: contrast — the graceful ending ────────────────────────
  - id: "evt_tcp_fin_intro"
    type: "annotation"
    t_ns: 2900000000
    annotation:
      text: "Contrast — rewind to the healthy poll and end the same session gracefully with FIN"
      detail: >
        Now the alternate ending. Rewind to just after poll #1 completed:
        both sides ESTABLISHED, client at sequence 6000121, server at
        9000311, nothing unread anywhere. This time the monitoring agent is
        being decommissioned cleanly: it calls close() with empty buffers,
        and TCP performs the 4-way FIN teardown — the polite way for both
        sides to prove that every last byte arrived.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "ESTABLISHED"
          - layer: 7
            name: "Application"
            state_fields:
              app_state: "shutting down cleanly"
              errno: "—"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "ESTABLISHED"
              recv_queue: "empty"
          - layer: 7
            name: "Application"
            state_fields:
              app_state: "serving /status"
              process: "PID 4242, running"

  - id: "evt_tcp_fin_client"
    type: "frame_tx"
    t_ns: 3000000000
    frame_id: "tcp_fin_client"
    annotation:
      text: "TCP FIN+ACK → 'no more data from me' — a half-close, not a hang-up"
      detail: >
        close() with clean buffers sends FIN. Like SYN, the FIN occupies one
        sequence number (6000121) so its delivery can be confirmed. The client
        enters FIN_WAIT_1. Note the asymmetry with RST: a FIN only closes the
        client→server direction; the server could keep sending for as long as
        it wants, and the client would still receive it.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "FIN_WAIT_1"
              snd_nxt: "6000122"

  - id: "evt_tcp_fin_ack_server"
    type: "frame_tx"
    t_ns: 3000060000
    frame_id: "tcp_fin_ack_server"
    annotation:
      text: "TCP ACK ← the FIN is acknowledged; server enters CLOSE_WAIT"
      detail: >
        The server ACKs 6000122 (FIN consumed one number) and enters
        CLOSE_WAIT: "the peer is done; I should finish up too." The client
        moves to FIN_WAIT_2. In production, connections stuck in CLOSE_WAIT
        are a classic symptom of an application that forgot to call close() —
        the kernel is waiting on the app, and will wait forever.
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "FIN_WAIT_2"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "CLOSE_WAIT"
              rcv_nxt: "6000122"

  - id: "evt_tcp_fin_server"
    type: "frame_tx"
    t_ns: 3000120000
    frame_id: "tcp_fin_server"
    annotation:
      text: "TCP FIN+ACK ← the server finishes its side"
      detail: >
        The status service notices EOF on its read, finishes its own cleanup,
        and calls close(). The server's FIN occupies sequence 9000311 and
        moves it to LAST_ACK — waiting for one final acknowledgment before it
        can free the connection entirely.
    state_after:
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "LAST_ACK"
              snd_nxt: "9000312"

  - id: "evt_tcp_fin_ack_client"
    type: "frame_tx"
    t_ns: 3000180000
    frame_id: "tcp_fin_ack_client"
    annotation:
      text: "TCP ACK → teardown complete; the client holds TIME_WAIT for 60 s"
      detail: >
        The final ACK (9000312) releases the server, which frees all state
        for this connection immediately. The client — as the side that closed
        first — enters TIME_WAIT for 2×MSL (60 s on Linux). TIME_WAIT is not
        a bug or a leak: it guarantees this last ACK can be retransmitted if
        the server's FIN reappears, and it shields the port pair from stale
        segments leaking into a future connection. Every byte both sides ever
        sent has been provably delivered and acknowledged — that is the
        promise the RST path could not make.
      spec_refs:
        - document: "RFC 9293"
          section: "3.5.4"
          title: "TIME-WAIT State"
          url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.4"
    state_after:
      - actor_id: "client"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "TIME_WAIT (60 s)"
      - actor_id: "server"
        layers:
          - layer: 4
            name: "TCP"
            state_fields:
              tcp_state: "CLOSED"

  - id: "evt_summary"
    type: "annotation"
    t_ns: 3100000000
    annotation:
      text: "Scenario complete — RST vs FIN: abort vs proof of delivery"
      detail: >
        The same connection, two endings:

        • RST — one unnegotiated segment; the connection vanishes in both
          directions instantly; unread data is discarded; the peer learns via
          ECONNRESET (on read) or EPIPE/SIGPIPE (on send); no TIME_WAIT.
          A reset says: something broke, and delivery of your data is not
          guaranteed.

        • FIN — a four-segment negotiation; each direction closes separately;
          every byte is acknowledged before state is freed; the first closer
          pays 60 s of TIME_WAIT. A FIN says: we are done, and everything
          arrived.

        When you see mid-connection RSTs in a capture, line up the suspects
        by pattern: RST immediately after your data → the peer application
        died or was restarted; RST after exactly N minutes of idleness → a
        firewall or load-balancer idle timeout (add keepalives shorter than
        N); RSTs on connections that worked seconds ago from a rebooted host
        → lost TCP state. The reset itself is identical in all three — the
        timing tells you who sent it and why.

# ─────────────────────────────────────────────────────────────────
# GLOSSARY
# ─────────────────────────────────────────────────────────────────
glossary:
  - term: "ECONNRESET"
    definition: "errno delivered when a read/recv follows a received RST: 'Connection reset by peer.' The connection was destroyed by the other side without a graceful close."
    spec_refs:
      - document: "RFC 9293"
        section: "3.5.3"
        title: "Reset Processing"
        url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.3"

  - term: "EPIPE / SIGPIPE"
    definition: "What a send/write into a reset connection produces: the EPIPE errno plus the SIGPIPE signal (which kills the process unless handled — the classic cause of silently dying scripts). Same underlying RST as ECONNRESET; different syscall direction."

  - term: "Abortive Close"
    definition: "Terminating a connection with RST instead of FIN. Happens when a socket is closed with unread data pending (RFC 1122 §4.2.2.13), when SO_LINGER is set to zero, or when a host has no state for an arriving segment (e.g. after a restart)."
    spec_refs:
      - document: "RFC 1122"
        section: "4.2.2.13"
        title: "Closing a Connection"
        url: "https://datatracker.ietf.org/doc/html/rfc1122#section-4.2.2.13"

  - term: "Half-Close"
    definition: "A FIN closes only the sender's direction. The peer may continue transmitting indefinitely; the FIN sender must keep receiving. This is why graceful teardown takes four segments — each direction is closed independently."
    spec_refs:
      - document: "RFC 9293"
        section: "3.6"
        title: "Closing a Connection"
        url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.6"

  - term: "CLOSE_WAIT"
    definition: "The state after receiving (and ACKing) the peer's FIN, before the local application calls close(). Connections piling up in CLOSE_WAIT indicate an application that isn't closing its sockets — the kernel will wait indefinitely."

  - term: "TIME_WAIT"
    definition: "Held for 2×MSL (60 s on Linux) by whichever side sent the first FIN, after teardown completes. Guarantees the final ACK can be resent and prevents stale segments from contaminating a new connection on the same port pair. The RST path skips it — one reason aborts are 'cheaper' but dirtier."
    spec_refs:
      - document: "RFC 9293"
        section: "3.5.4"
        title: "TIME-WAIT State"
        url: "https://datatracker.ietf.org/doc/html/rfc9293#section-3.5.4"

  - term: "In-Window Reset Validation"
    definition: "A receiver only accepts an RST whose sequence number falls inside the current receive window — the defense against blind off-path reset injection. RFC 5961 tightened this further after practical attacks."
    spec_refs:
      - document: "RFC 5961"
        section: "3"
        title: "Blind Reset Attack Using the RST Bit"
        url: "https://datatracker.ietf.org/doc/html/rfc5961#section-3"

  - term: "Idle Timeout Reset"
    definition: "Stateful middleboxes (firewalls, load balancers, NAT gateways) drop or reset flows that stay idle past a threshold (commonly 5–60 minutes). Long-lived quiet connections need TCP keepalives or application-level pings shorter than the smallest timeout on the path."

# ─────────────────────────────────────────────────────────────────
# WALKTHROUGHS
# ─────────────────────────────────────────────────────────────────
walkthroughs:
  - id: "default"
    title: "How Connections Die: RST vs FIN"
    description: "Watch a server crash turn into an ECONNRESET on the client, then rewind and see the same session end gracefully with the 4-way FIN teardown"
    steps:
      - step: 0
        narration: >
          The setup: a monitoring agent polls a status service every two
          seconds over one long-lived TCP connection — established hours ago,
          reused thousands of times. Connection reuse is standard practice
          (handshakes cost latency), but it means the connection's health and
          the application's health are two different things, as we're about
          to see.
        highlight_fields: []

      - step: 1
        narration: >
          Poll number ~3,600: a 120-byte GET /status. PSH tells the server's
          stack to deliver it to the application immediately. Sequence
          numbers track every byte — this poll occupies 6000001 through
          6000120 of the client's stream.
        highlight_fields: ["tcp.seq", "tcp.flags"]

      - step: 2
        narration: >
          The service answers 200 OK with a small JSON body — 310 bytes,
          150 microseconds round trip. Everything about this exchange is
          routine. Savor it; it's the last healthy poll this connection will
          ever complete.
        highlight_fields: ["tcp.seq", "tcp.ack"]

      - step: 3
        narration: >
          The client ACKs and sleeps for two seconds. Important detail: an
          idle TCP connection is pure silence — no packets, no probes, just
          two kernels remembering state. If something happens to one end
          during the silence, the other end has no way to know until it next
          transmits.
        highlight_fields: ["tcp.ack"]

      - step: 4
        narration: >
          Poll #2 leaves on schedule. The server's kernel receives it, ACKs
          internally, and queues 120 bytes into the socket's receive buffer
          for the application to read. Keep your eye on those 120 bytes —
          they're about to decide how this connection dies.
        highlight_fields: ["tcp.seq"]

      - step: 5
        narration: >
          The status service dereferences a bad pointer and dies — SIGSEGV.
          The kernel now owns a connected socket whose process is gone, with
          120 unread bytes in the queue. RFC 1122 §4.2.2.13 leaves no choice:
          closing with pending received data must abort with RST. A FIN would
          lie — it would tell the client "everything you sent was delivered,"
          and it wasn't.
        highlight_fields: []

      - step: 6
        narration: >
          The reset: RST+ACK, sequence 9000311 — exactly SND.NXT, so the
          client will accept it as genuine (out-of-window resets are ignored;
          that's the defense against blind injection attacks). Notice the ACK
          number still acknowledges the poll: the kernel got the bytes, they
          just had nowhere to go. One segment, no negotiation, no reply —
          the connection is gone in both directions.
        highlight_fields: ["tcp.flags", "tcp.seq", "tcp.ack"]

      - step: 7
        narration: >
          The client's blocked recv() wakes with ECONNRESET — "Connection
          reset by peer." Had it been writing instead, it would have gotten
          EPIPE and a SIGPIPE. Same event, two different error messages
          depending on which direction the application was facing — worth
          remembering when correlating logs across services. And a crashed
          app is only one RST source: restarted servers, firewall session
          expiry, and load-balancer idle timeouts all produce the same
          segment.
        highlight_fields: []

      - step: 8
        narration: >
          Now the alternate ending. Rewind to just after poll #1: both sides
          ESTABLISHED, buffers empty. This time the agent is decommissioned
          cleanly and calls close() — and TCP gets to show off its polite
          side: the 4-way FIN teardown.
        highlight_fields: []

      - step: 9
        narration: >
          FIN+ACK from the client: "I have nothing more to send." The FIN
          occupies one sequence number so it can be acknowledged reliably —
          same trick as SYN. And it's only a half-close: the server could
          keep sending data, and the client would still receive it. Compare
          that with the RST, which killed both directions at once.
        highlight_fields: ["tcp.flags", "tcp.seq"]

      - step: 10
        narration: >
          The server ACKs the FIN (6000122 — the FIN consumed one number) and
          enters CLOSE_WAIT: "peer is done, I should wrap up." Ops note: if
          you ever see hundreds of connections parked in CLOSE_WAIT, the
          application above them forgot to call close(). The kernel will wait
          politely forever.
        highlight_fields: ["tcp.ack"]

      - step: 11
        narration: >
          The service finishes its cleanup and closes its side: FIN sequence
          9000311, state LAST_ACK. Both directions have now said "done" —
          one acknowledgment remains.
        highlight_fields: ["tcp.flags", "tcp.seq"]

      - step: 12
        narration: >
          The final ACK. The server frees everything instantly; the client, as
          first closer, holds TIME_WAIT for 60 seconds — insurance that the
          last ACK can be resent and that stale segments can't haunt a future
          connection on the same ports. The scoreboard: every byte sent by
          either side was provably delivered. That's what the four segments
          buy you.
        highlight_fields: ["tcp.ack"]

      - step: 13
        narration: >
          Final comparison: RST = one segment, instant, bidirectional,
          data may be lost, no TIME_WAIT — an abort. FIN = four segments,
          negotiated, per-direction, everything acknowledged, TIME_WAIT held —
          a receipt. When you find mid-connection resets in a capture, date
          them: right after your data → dead or restarted peer application;
          exactly N minutes idle → middlebox timeout, add keepalives; after a
          host reboot → lost state. Same flag, three different culprits,
          separable by timing alone.
        highlight_fields: []
