            bits: 8
            value: "0x18"
            description: "PSH+ACK — a complete application message, deliver promptly"
            fields:
              - name: "ACK"
                abbrev: "tcp.flags.ack"
                bits: 1
                value: 1
                description: "Acknowledgment field valid"
              - name: "PSH"
                abbrev: "tcp.flags.push"
                bits: 1
